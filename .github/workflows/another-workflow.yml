# Second workflow to test multiple check suites
name: Secondary CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Job 1: Passes
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation
        run: echo "Checking documentation..."
      - name: List markdown files
        run: find . -name "*.md" | head -20

  # Job 2: Validate Config
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Validate configuration
        run: echo "Validating configuration..."
      - name: Run build check
        run: npx ng build
