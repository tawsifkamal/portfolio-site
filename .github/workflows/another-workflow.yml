# Second workflow to test multiple check suites
name: Secondary CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Job 1: Passes
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation
        run: echo "Checking documentation..."
      - name: List markdown files
        run: find . -name "*.md" | head -20
      - name: Fail docs check
        run: exit 1

  # Job 2: Validates config
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        run: echo "Validating configuration..."
