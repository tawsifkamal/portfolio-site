# Second workflow to test multiple check suites
name: Secondary CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Job 1: Passes
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation
        run: |
          echo "Checking documentation..."
          exit 1
      - name: List markdown files
        run: find . -name "*.md" | head -20

  # Job 2: This will fail
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        run: echo "Validating configuration..."
      - name: Intentional failure
        run: exit 1
