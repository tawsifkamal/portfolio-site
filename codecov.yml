# Codecov configuration
# This file controls which check runs Codecov creates and their failure thresholds
# See: https://docs.codecov.com/docs/codecovyml-reference

coverage:
  status:
    # Project coverage - overall project coverage check
    project:
      default:
        target: 80%  # Must maintain 80% overall coverage
        threshold: 1%  # Allow 1% drop before failing
        # This will create a "codecov/project" check run

    # Patch coverage - coverage of new/changed lines
    patch:
      default:
        target: 100%  # All new lines must be covered
        threshold: 0%  # No tolerance - strict 100% on patches
        # This will create a "codecov/patch" check run

    # Changes - shows coverage changes (informational)
    changes:
      default:
        target: 0%  # Will always show changes
        # This will create a "codecov/changes" check run

# Component-specific coverage (creates additional check runs per component)
component_management:
  default_rules:
    statuses:
      - type: project
        target: 80%
      - type: patch
        target: 100%
  individual_components:
    - component_id: "app_component"
      name: "App Component"
      paths:
        - "src/app/**"
    - component_id: "services"
      name: "Services"
      paths:
        - "src/app/services/**"

# Flag management (creates check runs per flag)
flag_management:
  default_rules:
    statuses:
      - type: project
        target: 80%
      - type: patch  
        target: 100%
  individual_flags:
    - name: unit
      paths:
        - "src/**"
    - name: integration
      paths:
        - "tests/**"
