<div class="article-section">
  <div class="article-section-header">
    <h1 class="title">Articles</h1>
    <img src="assets/images/linkClipIcon.png" />
  </div>

  @for (article of articles; track $index) {
  <div class="article-list">
    <a
      class="article-link"
      [ngStyle]="screen.isSmall ? { 'text-decoration': 'underline' } : {}"
      [href]="article.link"
      target="_blank"
      >{{ article.name }}</a
    >
  </div>
  }
</div>
